version: 2

updates:
  # GitHub Actions versions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop          # branch flow: never PR straight into main
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ['*']

  # Python dependencies. Numerics libraries change quantization results, so only
  # patch updates are proposed for them; minor/major bumps are done by hand in a
  # feature branch followed by a baseline + gate re-run.
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, python]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: torch
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: torchvision
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: numpy
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: scipy
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: onnx*
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: ultralytics
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      dev-tools:
        patterns: [pytest*, ruff, mypy]
